services:
  # ─────────────────────────────────────────────────────────────
  #  PostgreSQL — relational DB (users, claims, cases, registry)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartcourt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcourt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartcourt_secret}
      POSTGRES_DB: ${POSTGRES_DB:-smartcourt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartcourt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  #  Qdrant — vector DB (legal corpus, precedents, embeddings)
  # ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartcourt_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─────────────────────────────────────────────────────────────
  #  Redis — cache + LLM token-stream pub/sub
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartcourt_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # ─────────────────────────────────────────────────────────────
  #  Neo4j — graph DB (CorruptAlert relationship analysis)
  #  Optional: start with `docker compose --profile graph up`
  # ─────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: smartcourt_neo4j
    restart: unless-stopped
    profiles: ["graph", "full"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-smartcourt_graph}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # ─────────────────────────────────────────────────────────────
  #  Backend — FastAPI (Python 3.11)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcourt_backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Connect to host-installed Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartcourt}:${POSTGRES_PASSWORD:-smartcourt_secret}@postgres:5432/${POSTGRES_DB:-smartcourt}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU passthrough for faster-whisper (CUDA). Whisper time-shares the
    # 6 GB card with the host Ollama LLM: Whisper auto-unloads when idle and
    # hearing insights run on CPU, so they don't both occupy VRAM at once.
    gpus: all
    volumes:
      - ./app:/code/app
      - ./storage:/code/storage
      - whisper_models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  neo4j_data:
  whisper_models:
